name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build Debug APK
      run: ./gradlew assembleDebug
      
    - name: Build Release APK (unsigned)
      run: ./gradlew assembleRelease
      
    - name: Get APK files
      id: get_apk
      run: |
        DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
        RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
        echo "debug_apk=$DEBUG_APK" >> $GITHUB_OUTPUT
        echo "release_apk=$RELEASE_APK" >> $GITHUB_OUTPUT
      
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ${{ steps.get_apk.outputs.debug_apk }}
          ${{ steps.get_apk.outputs.release_apk }}
        body: |
          ## Metrolist APK Release
          
          **Version:** ${{ github.ref_name }}
          
          ### Files:
          - **Debug APK** - For testing and development
          - **Release APK** - For production use
          
          ### Installation:
          1. Download the APK file from below
          2. Enable "Install from unknown sources" in your Android settings
          3. Open the downloaded APK and tap Install
          
          ### Bug Fixes & Features in this release:
          - MP3 upload fix
          - Performance improvements
          - Various bug fixes
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: apk-builds-${{ github.run_number }}
        path: |
          app/build/outputs/apk/debug/**/*.apk
          app/build/outputs/apk/release/**/*.apk
        retention-days: 30
